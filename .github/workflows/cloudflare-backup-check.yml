name: Validate Cloudflare backup branch
on:
  push:
    branches:
      - cloudflare-backup-workers
    paths:
      - "package.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-backup-check.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Lock Cloudflare dependencies
        run: |
          npm install -D @cloudflare/vite-plugin@latest wrangler@latest --save-exact
      - name: Test Cloudflare build
        run: npm run build
      - name: Save tested dependency lockfile to backup branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock tested Cloudflare Workers dependencies"
            git push origin HEAD:cloudflare-backup-workers
          fi
